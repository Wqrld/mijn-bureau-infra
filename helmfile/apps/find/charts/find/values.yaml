## @section Service parameters

service:
  type: ClusterIP
  ports:
    http: 80
  nodePorts:
    http: ""
  clusterIP: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Cluster
  annotations: {}
  extraPorts: []
  sessionAffinity: None
  sessionAffinityConfig: {}

## @section Job parameters

job:
  ttlSecondsAfterFinished: 100
  backoffLimit: 6
  restartPolicy: OnFailure
  releaseSuffix: ""
  podAnnotations: {}
  resources: {}
  commandMigrate:
    - /bin/sh
    - -c
    - |
      python manage.py migrate --no-input

      python manage.py shell -c "
      from django.contrib.auth import get_user_model
      import os
      U = get_user_model()
      email = os.environ.get('DJANGO_SUPERUSER_EMAIL', '')
      password = os.environ.get('DJANGO_SUPERUSER_PASSWORD', '')
      if email and password:
          if not U.objects.filter(email=email).exists():
              U.objects.create_superuser(username=email, email=email, password=password)
              print('Superuser created:', email)
          else:
              u = U.objects.get(email=email)
              u.set_password(password)
              u.is_staff = True
              u.is_superuser = True
              u.save()
              print('Superuser updated:', email)
      "

      python manage.py shell -c "
      from core.models import Service
      import os
      services = {}
      if os.environ.get('FIND_SERVICE_TOKEN_DOCS'):
          svc, _ = Service.objects.update_or_create(
              name='docs',
              defaults={
                  'token': os.environ['FIND_SERVICE_TOKEN_DOCS'],
                  'client_id': 'docs',
                  'is_active': True,
              },
          )
          services['docs'] = svc
          print('Service docs: token=' + svc.token[:8] + '...')
      if os.environ.get('FIND_SERVICE_TOKEN_DRIVE'):
          svc, _ = Service.objects.update_or_create(
              name='drive',
              defaults={
                  'token': os.environ['FIND_SERVICE_TOKEN_DRIVE'],
                  'client_id': 'drive',
                  'is_active': True,
              },
          )
          services['drive'] = svc
          print('Service drive: token=' + svc.token[:8] + '...')
      for svc in services.values():
          svc.services.set(services.values())
      print('Find services configured.')
      "
  argsMigrate: []

