## @section Global parameters

global:
  imageRegistry: ""
  imagePullSecrets: []
  defaultStorageClass: ""
  security:
    allowInsecureImages: true
  compatibility:
    openshift:
      adaptSecurityContext: auto
      omitEmptySeLinuxOptions: false

## @section Common parameters

kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}
clusterDomain: cluster.local
extraDeploy: []

diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section find Parameters

find:
  image:
    registry: docker.io
    repository: lasuite/find
    tag: v0.0.3
    digest: ""
    pullPolicy: Always
    pullSecrets: []
    debug: false

  replicaCount: 1

  containerPorts:
    http: 8000

  resourcesPreset: "nano"
  resources: {}

  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001

  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"

  automountServiceAccountToken: false

  podLabels: {}
  podAnnotations: {}
  deploymentAnnotations: {}

  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {}

  hostAliases: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  priorityClassName: ""
  schedulerName: ""
  runtimeClassName: ""
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: ""

  initContainers: []
  sidecars: []
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  extraVolumes: []
  extraVolumeMounts: []
  extraContainerPorts: []
  lifecycleHooks: {}

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  startupProbe:
    enabled: false
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
    successThreshold: 1

  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}

  autoscaling:
    vpa:
      enabled: false
      annotations: {}
      controlledResources: []
      maxAllowed: {}
      minAllowed: {}
      updatePolicy:
        updateMode: Auto
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: ""
      targetMemory: ""

  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: 1

  secretKey: ""
  superuserEmail: ""
  superuserPassword: ""
  CSRFTrustedOrigins: ""
  AllowedHosts: ""
  ## Token shared with docs for indexation (empty when docs integration disabled)
  findServiceTokenDocs: ""
  ## Token shared with drive for indexation (empty when drive integration disabled)
  findServiceTokenDrive: ""

  celery:
    replicaCount: 1
    command: []
    args:
      - celery
      - -A
      - find.celery_app
      - worker
      - -l
      - INFO
    resources: {}
    podLabels: {}

    autoscaling:
      vpa:
        enabled: false
        annotations: {}
        controlledResources: []
        maxAllowed: {}
        minAllowed: {}
        updatePolicy:
          updateMode: Auto
      hpa:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPU: ""
        targetMemory: ""

    pdb:
      create: true
      minAvailable: ""
      maxUnavailable: 1

